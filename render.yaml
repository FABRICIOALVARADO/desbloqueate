# Crear este servicio requiere aprobar un plan de pago en Render.
services:
  - type: web
    name: desbloqueate-uc
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/desbloqueate
    disk:
      name: datos-estudiantes
      mountPath: /var/data
      sizeGB: 1

