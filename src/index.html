<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Desbloquéate</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Organiza tus entregas universitarias y sabe qué hacer primero.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
#boot-loader{position:fixed;inset:0;z-index:100000;background:#100d19;color:#f1ecdf;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;transition:opacity .35s,visibility .35s}#boot-loader.leaving{opacity:0;visibility:hidden}.boot-window{width:min(680px,100%);border:2px solid #b59bea;border-radius:20px;box-shadow:-12px 12px 0 #6850b0;background:#1d172d;overflow:hidden}.boot-title{padding:19px 26px;border-bottom:2px solid #b59bea;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px}.boot-dots{display:flex;gap:8px}.boot-dots i{width:9px;height:9px;border-radius:50%;background:#b59bea}.boot-content{padding:48px 36px}.boot-caption{display:flex;align-items:center;justify-content:space-between;gap:20px}.boot-caption h1{font-size:clamp(22px,5vw,36px);margin:0 0 12px}.boot-pencil{font-size:44px;display:block;color:#b59bea;animation:boot-pencil 1.5s ease-in-out infinite}.boot-meter{height:30px;padding:5px;border:2px solid #b59bea;border-radius:30px;margin:22px 0 18px}.boot-fill{width:0%;height:100%;border-radius:20px;background:repeating-linear-gradient(120deg,#b59bea 0 18px,#f1ecdf 18px 28px);transition:width .35s ease}.boot-footer{display:flex;justify-content:space-between;align-items:center;gap:20px}.boot-footer p{font-size:13px;color:#c3b8d8;max-width:440px;line-height:1.5}.boot-number{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}.boot-number small{font-size:18px}.boot-retry{display:inline-block;margin-top:20px;border-radius:30px;padding:12px 22px;background:#b59bea;color:#191325;text-decoration:none;font-weight:700}.boot-retry[hidden]{display:none}@keyframes boot-pencil{50%{transform:translateY(-8px) rotate(-12deg)}}@media(max-width:500px){.boot-content{padding:30px 22px}.boot-title{padding:16px;font-size:10px}.boot-window{box-shadow:-7px 7px 0 #6850b0}.boot-number{font-size:30px}}@media(prefers-reduced-motion:reduce){#boot-loader,.boot-fill{transition:none}.boot-pencil{animation:none}}
</style></head>
<body>
  <div id="boot-loader" aria-label="Preparando Desbloquéate"><div class="boot-window"><div class="boot-title"><strong>DESBLOQUÉATE / TU ESPACIO</strong><span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span></div><div class="boot-content"><div class="boot-caption"><div><h1>Tu próximo capítulo<br>está por comenzar.</h1></div><span class="boot-pencil" aria-hidden="true">✎</span></div><div id="boot-progress" class="boot-meter" role="progressbar" aria-label="Preparación de la página" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="boot-fill" class="boot-fill"></div></div><div class="boot-footer"><p id="boot-status" role="status">Cargando la aplicación…</p><span class="boot-number"><span id="boot-value">0</span><small>%</small></span></div><a id="boot-retry" class="boot-retry" href="" hidden>Reintentar carga ↗</a><noscript><p>Activa JavaScript para abrir Desbloquéate.</p></noscript></div></div></div><app-root></app-root>
</body>
</html>
